# Fails a pull request whose commits or description attribute the change to Claude or Anthropic.

name: No Claude co-author

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  no-claude-coauthor:
    name: no-claude-coauthor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Claude and Anthropic attribution
        shell: bash
        env:
          # Passed as an environment value so the description is data, not shell source.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ ! "${BASE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "${HEAD_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Base or head SHA is missing or not a 40-character hexadecimal commit."
            exit 1
          fi

          # Case-insensitive line match:
          #   Co-authored-by: ...claude... or ...anthropic...
          #   Generated with Claude Code
          #   Generated with [Claude Code]
          is_forbidden_line() {
            local line="$1"
            if printf '%s\n' "$line" | grep -iEq '^[[:space:]]*co-authored-by:.*(claude|anthropic)'; then
              return 0
            fi
            if printf '%s\n' "$line" | grep -iEq 'generated[[:space:]]+with[[:space:]]+\[?claude[[:space:]]+code\]?'; then
              return 0
            fi
            return 1
          }

          ensure_commit() {
            local sha="$1"
            local label="$2"
            if git cat-file -e "${sha}^{commit}" >/dev/null 2>&1; then
              return 0
            fi
            echo "Fetching ${label} commit ${sha}..."
            if ! git fetch --no-tags origin "${sha}"; then
              echo "Could not fetch ${label} commit ${sha}."
              exit 1
            fi
            if ! git cat-file -e "${sha}^{commit}" >/dev/null 2>&1; then
              echo "${label} commit ${sha} is still not available. Checkout needs fetch-depth: 0."
              exit 1
            fi
          }

          ensure_commit "$BASE_SHA" "base"
          ensure_commit "$HEAD_SHA" "head"

          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          failed=0

          scan_text() {
            local label="$1"
            local text="$2"
            local lineno=0
            local header=0
            local line
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%$'\r'}"
              lineno=$((lineno + 1))
              if is_forbidden_line "$line"; then
                if [[ "$header" -eq 0 ]]; then
                  if [[ -s "$report" ]]; then
                    printf '\n' >> "$report"
                  fi
                  printf '%s\n' "$label" >> "$report"
                  header=1
                fi
                printf '  line %d: %s\n' "$lineno" "$line" >> "$report"
                failed=1
              fi
            done <<< "$text"
          }

          commits=$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          count=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            count=$((count + 1))
            subject=$(git --no-pager show -s --format=%s "$sha")
            message=$(git --no-pager show -s --format=%B "$sha")
            short=$(git rev-parse --short=12 "$sha")
            scan_text "commit ${short} ${sha} (${subject})" "$message"
          done <<< "$commits"

          scan_text "pull request description" "${PR_BODY:-}"

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Claude or Anthropic attribution is not allowed in pull request commits or the description."
            echo "Claude or Anthropic attribution is not allowed in this pull request."
            echo
            echo "Matching lines:"
            cat "$report"
            echo
            printf '%s\n' \
              "How to fix:" \
              "  For commit messages, reword the listed commits and delete the matching lines:" \
              "    git rebase -i ${BASE_SHA}" \
              "  Mark each listed commit as reword, save, then force-push:" \
              "    git push --force-with-lease" \
              "  For a matching pull request description, edit the description and delete those lines."
            exit 1
          fi

          echo "Checked ${count} commit(s) in ${BASE_SHA}..${HEAD_SHA}; no Claude or Anthropic attribution lines found."
